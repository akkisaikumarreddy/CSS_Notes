<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS - Forms</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <h1>Forms</h1>

    <p>
        CSS Form Styling enhances the look and usability of HTML forms.<br>
        It allows customization of input fields, buttons, labels, and layouts to create clean, consistent, and user-friendly form designs.
    </p>

    <form>
        
        <fieldset>

            <legend>User's Information</legend>

            <!-- Personal Information Group -->
            <fieldset>

                <legend>Personal Information</legend>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter Your Name" required> <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter Your Email" required> <br><br>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" placeholder="Enter Your Age" required> <br><br>

            </fieldset>  

            <!-- Account Information  Group -->
            <fieldset>

                <legend>Account Information</legend>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter Your Password" required> <br><br>

                <label for="course">Course</label>
                <select id="course" name="course">
                    <option value=""></option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                </select>

            </fieldset>

            <!-- Preferences Group -->
            <fieldset>

                <legend>Preferences</legend>

                <label for="gender">Gender:</label>

                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <br>

                <label>
                    Subscribe to News-Channel:<input type="checkbox" name="subscribe">
                </label>

            </fieldset>

            <!-- Submit button -->
            <button type="submit">Submit</button>

        </fieldset>
    </form>
    
</body>

</html>
