<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Focus Selector Example</title>
    <style>
        input:focus {
            outline: none;
            background-color: lightyellow;
        }

        textarea:focus {
            border: 2px solid green;
        }

        button:focus {
            outline: 3px dashed red;
        }
    </style>
</head>
<body>

    <h1>Focus Selector Demo</h1>

    <input type="text" placeholder="Click or Tab here">
    <br><br>
    <textarea placeholder="Focus me"></textarea>
    <br><br>
    <button>Focus me</button>

</body>
</html>
