<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Style - Star Selector</title>

    <style type="text/css">

        * {
            color: darkblue;
            background-color: lightyellow;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: darkred;
        }

    </style>

</head>

<body>

    <h1>Star Selector</h1>

    <p>The Star Selector in CSS is the universal selector. <br>
        It’s written as * and it targets all elements in the document. <br>
        Think of it as “apply this style to everything.”
    </p>
    
    <p><strong>Syntax :</strong></p>

    <pre>
    <code>
    * {
    property: value;
    }
    </code>
    </pre>

</body>

</html>
