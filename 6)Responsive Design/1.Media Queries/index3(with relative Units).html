<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Responsive Design</title>

    <link rel="stylesheet" href="styles3.css">

</head>

<body>
    <div class="main-container">
        <div class="reviews-grid">
            <div class="review-card">
                <h3 class="review-heading">Review 1</h3>
                <p class="review-text">"Amazing Product! Highly recommend it to everyone!"</p>
                <p class="review-person">Akki</p>
            </div>

            <div class="review-card">
                <h3 class="review-heading">Review 2</h3>
                <p class="review-text">"Great Value of price. Delivered quickly."</p>
                <p class="review-person">Sai</p>
            </div>

            <div class="review-card">
                <h3 class="review-heading">Review 3</h3>
                <p class="review-text">"Works as advertised. Would buy again."</p>
                <p class="review-person">Kumar</p>
            </div>

            <div class="review-card">
                <h3 class="review-heading">Review 4</h3>
                <p class="review-text">"Not what i expected, but decent quality"</p>
                <p class="review-person">Reddy</p>
            </div>
        </div>
    </div>
</body>

</html>
